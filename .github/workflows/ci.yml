name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Prüfen und testen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typprüfung
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit-Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Playwright-Version ermitteln
        id: playwright
        run: echo "version=$(npm ls @playwright/test --json | node -p 'Object.values(JSON.parse(require("fs").readFileSync(0,"utf8")).dependencies)[0].version')" >> "$GITHUB_OUTPUT"

      - name: Playwright-Browser aus dem Cache holen
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Playwright-Browser installieren
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Systemabhängigkeiten für Playwright installieren
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E-Tests
        run: npm run e2e

      - name: Berichte und Traces hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artefakte
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Auf GitHub Pages veröffentlichen
    needs: test
    # Nur für den Hauptzweig und nur bei grünen Tests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Build mit Repository-Unterpfad
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deployment
        id: deployment
        uses: actions/deploy-pages@v4
